<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Projects</title>
</head>
<body>
    <h1>Projects</h1>
    <div class="content">
        {{ page.content|raw }}
    </div>
    <div class="projects">
        {% for child in page.children %}
        <div class="project">
            <h2>{{ child.title }}</h2>
            {% if child.thumb %}
            <img src="{{ child.thumb.url }}" alt="{{ child.title }}">
            {% endif %}
        </div>
        {% endfor %}
    </div>
</body>
</html>
